<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>訂購產品入篋檢查系統</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>📦 訂購產品入篋檢查</h1>
    
    <!-- 上半部份：已入篋 -->
    <section class="panel arrived-panel">
      <h2>✅ 已入篋產品</h2>
      <div id="arrived-list" class="product-grid"></div>
    </section>

    <hr>

    <!-- 下半部份：未入篋 -->
    <section class="panel pending-panel">
      <h2>⏳ 未入篋產品</h2>
      <div id="pending-list" class="product-grid"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
